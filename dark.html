<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhairya Dhaka — Product Manager (Dark)</title>
<meta name="description" content="Dhairya Dhaka — Product Manager building AI agents for healthcare operations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Caveat:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E10}
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:84px}
a{color:inherit}
button{font:inherit;color:inherit}
.m-link{text-decoration:none;color:#8E8E96;transition:color .15s ease}
.m-link:hover{color:#EDEDEF}
.m-row{transition:background .2s ease}
.m-row:hover{background:#16161A}
.m-acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease;opacity:0}
.m-acc.open{grid-template-rows:1fr;opacity:1}
.m-acc>div{overflow:hidden}
.m-plus{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.m-plus.open{transform:rotate(45deg)}
.m-btn{transition:transform .2s ease,background .2s ease}
.m-btn:hover{transform:translateY(-1px)}
@supports (animation-timeline: view()){
.m-in{animation:mIn linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
@keyframes mIn{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
}
/* ---------- motion ---------- */
.h-up{animation:hUp .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes hUp{from{opacity:0;translate:0 18px}}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.12em;margin-bottom:-.12em}
.w>span{display:inline-block;animation:wUp .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes wUp{from{transform:translateY(115%)}}
.hl-sweep{background-repeat:no-repeat;background-size:100% 100%;animation:hlSweep .9s cubic-bezier(.65,0,.35,1) backwards;animation-delay:1.05s}
@keyframes hlSweep{from{background-size:0% 100%}}
.ph-in{animation:phIn 1.2s cubic-bezier(.2,.8,.2,1) backwards .25s}
@keyframes phIn{from{clip-path:inset(100% 0 0 0 round 14px);scale:1.08}to{clip-path:inset(0 0 0 0 round 14px);scale:1}}
.ph-tilt{transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tag-pop{animation:tagPop .6s cubic-bezier(.34,1.56,.64,1) backwards 1.3s;transition:rotate .3s ease}
@keyframes tagPop{from{opacity:0;transform:scale(.4)}}
figure:hover .tag-pop{rotate:3deg}
.m-nav{position:relative}
.m-nav::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1.5px;background:#EDEDEF;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.m-nav:hover::after,.m-nav.is-active::after{transform:scaleX(1)}
.m-link.is-active{color:#EDEDEF}
.m-progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#EDEDEF;transform:scaleX(0);transform-origin:0 50%}
.m-sec{position:relative}
.m-sec::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:160px;background:#EDEDEF;transform:scaleX(0);transform-origin:left}
.m-row .m-title{display:inline-block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.m-row:hover .m-title{transform:translateX(6px)}
.m-row .m-num{transition:color .2s ease}
.m-row:hover .m-num{color:#EDEDEF}
.m-btn svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
a.m-case svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
a.m-case:hover svg{transform:translateX(4px)}
a.m-case{text-decoration:underline;text-underline-offset:5px;text-decoration-color:transparent;transition:text-decoration-color .2s ease}
a.m-case:hover{text-decoration-color:currentColor}
.m-btn:hover svg{transform:translateX(3px)}
.m-field{transition:border-color .2s ease,box-shadow .25s ease}
.m-field:focus{outline:none;border-color:#EDEDEF;box-shadow:0 0 0 4px rgba(237,237,239,0.12)}
.m-step{position:relative;padding-top:24px}
.m-step::before{content:"";position:absolute;left:0;right:-28px;top:4px;height:1px;background:#2A2A30}
.m-step:last-child::before{right:0}
.m-dot{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;background:#EDEDEF}
@supports (animation-timeline: scroll()){
.m-progress{animation:mProg linear both;animation-timeline:scroll(root)}
@keyframes mProg{to{transform:scaleX(1)}}
}
@supports (animation-timeline: view()){
.m-sec::before{animation:mRule linear both;animation-timeline:view();animation-range:entry 10% cover 30%}
@keyframes mRule{to{transform:scaleX(1)}}
.m-st{animation:mIn linear both;animation-timeline:view();animation-range:entry calc(var(--i,0) * 4%) cover calc(18% + var(--i,0) * 4%)}
.m-dot{animation:mDot linear both;animation-timeline:view();animation-range:entry calc(20% + var(--i,0) * 6%) cover calc(30% + var(--i,0) * 6%)}
@keyframes mDot{from{transform:scale(0)}to{transform:scale(1)}}
}
.m-theme{opacity:.75;transition:opacity .2s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
.m-theme:hover{opacity:1;transform:rotate(-18deg)}
@media (prefers-reduced-motion: reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none !important;transition:none !important}
}
</style>

try { choice = window.sessionStorage.getItem('dd-theme-choice'); } catch (err) {}

try {

}, { rootMargin: '-45% 0px -50% 0px' });
secs.forEach((el) => this.io.observe(el));
} catch (err) {}
}
componentWillUnmount() { try { if (this.io) this.io.disconnect(); } catch (err) {} }
renderVals() {
const s = this.state;
const data = [
{ id: 'csa', href: 'claim-status-agent-dark.html', num: '01', title: 'Claim Status Agent', role: 'Owner · Infinx', status: 'Live',

];
const cases = data.map((c) => {

toggle: () => this.setState({ open: { ...this.state.open, [c.id]: !this.state.open[c.id] } }) };
});
const liBad = s.formStatus === 'error-li';
const msgColor = s.formStatus === 'sent' ? '#4ADE80' : (s.formStatus.indexOf('error') === 0 ? '#FF6B6B' : '#8E8E96');
const act = (id) => (s.active === id ? 'is-active' : '');
return {
setThemeLink: (el) => { this.themeLink = el; },

},
nav: { about: act('about'), work: act('work'), approach: act('approach'), now: act('now'), contact: act('contact') },

if (reduce) return;
const r = el.getBoundingClientRect();

el.style.transform = 'perspective(700px) rotateY(' + (px * 12).toFixed(2) + 'deg) rotateX(' + (-py * 12).toFixed(2) + 'deg) scale(1.02)';
},
untilt: () => { if (this.figEl) this.figEl.style.transform = ''; },
cases,
draft: s.draft, linkedin: s.linkedin, gotcha: s.gotcha, formMsg: s.formMsg,
liInvalid: liBad ? 'true' : 'false',

msgStyle: 'font-size: 14px; color: ' + msgColor + ';',

e.preventDefault();

el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
},
onDraft: (e) => this.setState({ draft: e.target.value, formStatus: this.state.formStatus === 'error-note' ? 'idle' : this.state.formStatus }),

onGotcha: (e) => this.setState({ gotcha: e.target.value }),
submitNote: (e) => {
if (e && e.preventDefault) e.preventDefault();
if (this.state.formStatus === 'sending') return;
const note = (this.state.draft || '').trim();
let li = (this.state.linkedin || '').trim();
if (!note) { this.setState({ formStatus: 'error-note', formMsg: 'Write a note first.' }); return; }
if (li && !/^https?:\/\//i.test(li)) li = 'https://' + li;
const m = li.match(/^https?:\/\/([a-z]{2,3}\.)?linkedin\.com\/(in|pub)\/([A-Za-z0-9\-_%.]+)\/?(\?.*)?$/i);
if (!m) { this.setState({ formStatus: 'error-li', formMsg: 'Add your LinkedIn profile link, like linkedin.com/in/your-name.' }); return; }

this.setState({ draft: '', linkedin: '', formStatus: 'sent', formMsg: msg });
};
if (this.state.gotcha) { finish(true, 'Thanks!'); return; }
this.setState({ formStatus: 'sending', formMsg: '' });
if (!this.formEndpoint || this.previewMode) {
setTimeout(() => finish(true, 'Preview mode: on the live site this goes straight to my inbox.'), 700);
return;
}
fetch(this.formEndpoint, {
method: 'POST',
headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
body: JSON.stringify({ note, linkedin: li, _subject: 'New note from your portfolio' })
}).then((r) => finish(r.ok, r.ok ? 'Thanks — your note is on its way to my inbox.' : 'Couldn’t send that. Please try again, or email me directly.'))
.catch(() => finish(false, 'Couldn’t send that. Please check your connection, or email me directly.'));
}
};
